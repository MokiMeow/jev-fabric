name: Bug report
description: Report a reproducible Jev Fabric defect without secrets or private state.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include API keys, credentials, customer data, or absolute machine paths.
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
